# Rasa Open Source 3.6.20 + WooCommerce bridge: deploy from PUBLIC prebuilt images.
#
# Images are built and published to GHCR by .github/workflows/publish-images.yml
# on every push to main. The Rasa image already contains the trained model.
#
#   docker compose pull
#   docker compose up -d
#   docker compose ps                    # wait for (healthy)
#
# Credentials are NEVER stored in this repository. Provide them as environment
# variables in your deployment platform, or in a local `.env` file next to this
# file (`.env` is git-ignored). See .env.example for the list.
#
# To build the images yourself instead of pulling them:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

x-bridge-env: &bridge-env
  WC_URL: ${WC_URL:-}
  WC_CONSUMER_KEY: ${WC_CONSUMER_KEY:-}
  WC_CONSUMER_SECRET: ${WC_CONSUMER_SECRET:-}
  WC_VERIFY_SSL: ${WC_VERIFY_SSL:-true}
  SITEMAP_URL: ${SITEMAP_URL:-}
  CRAWL_KINDS: ${CRAWL_KINDS:-page,post}
  CRAWL_MAX_PAGES: ${CRAWL_MAX_PAGES:-300}
  RETURN_WINDOW_DAYS: ${RETURN_WINDOW_DAYS:-30}
  MAX_ORDER_VERIFY_ATTEMPTS: ${MAX_ORDER_VERIFY_ATTEMPTS:-3}
  DELIVERY_DATE_META_KEYS: ${DELIVERY_DATE_META_KEYS:-}
  PAGE_ANSWER_MIN_SCORE: ${PAGE_ANSWER_MIN_SCORE:-2.0}
  CACHE_DIR: /app/bridge_cache
  LOOKUP_FILE: /app/lookups/lookups.yml

x-bridge-common: &bridge-common
  image: ${ACTIONS_IMAGE:-ghcr.io/shopjiaexpress-dev/rasa-woocommerce-bridge-actions:latest}
  environment: *bridge-env
  volumes:
    - bridge_cache:/app/bridge_cache
    - lookups:/app/lookups
  extra_hosts:
    - "host.docker.internal:host-gateway"   # lets WC_URL point to a store on this machine

services:
  rasa:
    image: ${RASA_IMAGE:-ghcr.io/shopjiaexpress-dev/rasa-woocommerce-bridge-rasa:latest}
    # Command, config and trained model come from the image.
    volumes:
      - tracker:/app/tracker
    networks:
      - default   # talks to action-server (and chatwoot-connector reaches it here)
      - npm       # shared with Nginx Proxy Manager, which forwards ai.jiaexpress.com here
    ports:
      # Only reachable from this server (your Caddy/Nginx reverse proxy).
      # Docker-published ports bypass ufw, so don't publish on 0.0.0.0.
      - "127.0.0.1:5005:5005"
    depends_on:
      action-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; s=json.load(urllib.request.urlopen('http://localhost:5005/status', timeout=5)); assert s.get('model_file'), 'no model loaded'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s     # loading the model takes a while on small servers
    restart: unless-stopped

  action-server:
    <<: *bridge-common
    # No published port: Rasa reaches it over the internal Docker network.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5055/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Syncs sitemap/products/pages at start-up and then every SYNC_INTERVAL_SECONDS (default 6h).
  # The action server picks up new data automatically.
  auto-sync:
    <<: *bridge-common
    entrypoint: ["sh", "-c", "while true; do python -m bridge.sync || echo 'sync failed'; sleep ${SYNC_INTERVAL_SECONDS:-21600}; done"]
    restart: unless-stopped

  # Chatwoot Agent Bot <-> Rasa. Chatwoot posts to https://<rasa-domain>/chatwoot/webhook,
  # which your reverse proxy forwards to 127.0.0.1:5056.
  chatwoot-connector:
    image: ${ACTIONS_IMAGE:-ghcr.io/shopjiaexpress-dev/rasa-woocommerce-bridge-actions:latest}
    entrypoint: ["python", "-m", "bridge.chatwoot_connector"]
    environment:
      CHATWOOT_URL: ${CHATWOOT_URL:-}
      CHATWOOT_BOT_TOKEN: ${CHATWOOT_BOT_TOKEN:-}
      CHATWOOT_WEBHOOK_SECRET: ${CHATWOOT_WEBHOOK_SECRET:-}
      CHATWOOT_URL_TOKEN: ${CHATWOOT_URL_TOKEN:-}
      RASA_URL: http://rasa:5005
    ports:
      - "127.0.0.1:5056:5056"
    depends_on:
      rasa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5056/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ---- optional one-off tools (docker compose run --rm <name>) ---------------
  sync:
    <<: *bridge-common
    entrypoint: ["python", "-m", "bridge.sync"]
    profiles: ["tools"]

  rasa-shell:
    image: ${RASA_IMAGE:-ghcr.io/shopjiaexpress-dev/rasa-woocommerce-bridge-rasa:latest}
    command: shell --model models --endpoints endpoints.yml
    stdin_open: true
    tty: true
    depends_on:
      action-server:
        condition: service_healthy
    profiles: ["tools"]

networks:
  default: {}
  # Nginx Proxy Manager's network. It must already exist (created by the NPM project):
  #   docker network ls | grep nginx-proxy-manager
  npm:
    external: true
    name: nginx-proxy-manager_default

volumes:
  tracker:
  lookups:
  bridge_cache:
